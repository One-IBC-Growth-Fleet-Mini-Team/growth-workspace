<title>Mi1 Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3D R&D lab in three bands. Left third: Mi1 with modules on short dashed orbits. Middle: a wall-mounted screen that shows Mi1's live process. Right: a second wall screen with the workstream board, covered by the frosted-glass work panel when a module opens. Phones: Mi1 and the process screen share the top band; modules sit in a dock below; panels open as a bottom sheet. */
:root{
  --lab:#E4DBCD; --ceramic:#F4EFE7; --sand:#CFC2AE; --carbon:#1D1E20; --ink:#24211C; --muted:#665E53;
  --led:#3FA9F5; --led-ink:#13629A; --good:#3A8457; --warn:#9C6C12; --crit:#B0453A;
  --glass:rgba(248,244,237,.56); --glass-strong:rgba(251,248,243,.84); --glass-line:rgba(255,255,255,.70); --hair:rgba(36,33,28,.12); --hair-2:rgba(36,33,28,.07);
  --shadow:0 24px 64px rgba(62,49,30,.20), 0 2px 6px rgba(62,49,30,.08);
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-disp:"Chakra Petch", "Be Vietnam Pro", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --top:calc(env(safe-area-inset-top, 0px) + 14px);
  color-scheme: light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--lab);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--led-ink);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-line);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.75)}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#fallback{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
#fallback img{height:min(58vh,520px);width:auto}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:var(--top);padding-left:var(--gutter-l);padding-right:var(--gutter-r);pointer-events:none}
#top > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:14px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--carbon);display:grid;place-items:center;color:#CFEAFF;font-family:var(--f-disp);font-weight:600;font-size:13px;flex:none}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.roles{display:flex;padding:4px;border-radius:12px;gap:2px}
.roles button{white-space:nowrap;border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);min-height:34px}
.roles button[aria-pressed="true"]{background:var(--carbon);color:#F4EFE7}
.data-note{font-size:11.5px;color:var(--muted);padding:8px 12px;border-radius:12px;max-width:250px;line-height:1.35}

.mod{position:absolute;left:0;top:0;pointer-events:auto;border-radius:10px;padding:4px 8px 5px;min-width:0;max-width:150px;text-align:left;transition:box-shadow .2s, background .2s, opacity .25s;will-change:transform}
.mod:hover,.mod:focus-visible{background:var(--glass-strong)}
.mod[aria-current="true"]{box-shadow:0 0 0 2px var(--led), var(--shadow)}
.mod .n{display:block;font-weight:600;font-size:11.5px;line-height:1.25;white-space:nowrap}
.mod .s{display:block;font-size:10px;color:var(--muted);margin-top:1px;line-height:1.3;white-space:nowrap}
.mod .s.alert{color:var(--crit)}

.tag{position:absolute;left:0;top:0;pointer-events:auto;border-radius:10px;padding:5px 9px;max-width:200px;text-align:left;will-change:transform}
.tag .code{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--carbon);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tag .task{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sand);flex:none;display:inline-block}
.st-thinking .dot,.st-working .dot{background:var(--led);box-shadow:0 0 0 3px rgba(63,169,245,.22);animation:pulse 1s ease-in-out infinite}
.st-done .dot{background:var(--good)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(63,169,245,0)}}
.bubble{position:absolute;left:0;top:0;z-index:300;pointer-events:none;border-radius:14px;padding:8px 12px;max-width:240px;font-size:12.5px;line-height:1.35;will-change:transform}
.bubble b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--led-ink);display:block}

#dock{display:none}
#panel{position:fixed;z-index:30;top:calc(var(--top) + 62px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:var(--gutter-r);width:max(380px, calc(33.4vw - 24px));border-radius:22px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(24px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s}
#panel.open{transform:none;opacity:1}
.p-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--hair)}
.p-head h2{font-family:var(--f-disp);font-weight:600;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.p-head .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.p-head .agent{font-family:var(--f-mono);font-size:11.5px;color:var(--led-ink)}
.p-close{margin-left:auto;border:1px solid var(--hair);background:rgba(255,255,255,.45);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.p-body{overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px;min-height:0;-webkit-overflow-scrolling:touch}
.p-foot{border-top:1px solid var(--hair);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.grab{display:none}

.sec{background:rgba(255,255,255,.42);border:1px solid var(--hair-2);border-radius:16px;padding:14px}
.sec h3{font-family:var(--f-disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.5);border:1px solid var(--hair-2);border-radius:14px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi .v{font-family:var(--f-disp);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .h{font-size:11px;color:var(--muted);margin-top:2px}
.src{font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 9px;border:1px solid var(--hair);background:rgba(255,255,255,.55);white-space:nowrap}
.chip.good{color:var(--good);border-color:rgba(58,132,87,.35)}
.chip.warn{color:var(--warn);border-color:rgba(156,108,18,.35)}
.chip.crit{color:var(--crit);border-color:rgba(176,69,58,.35)}
.chip.led{color:var(--led-ink);border-color:rgba(19,98,154,.3)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--hair)}
td{padding:7px 8px;border-bottom:1px solid var(--hair-2);vertical-align:top}
td.num,th.num{text-align:right}
.tw{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:rgba(29,30,32,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--carbon);border-radius:4px}
.bar.led i{background:var(--led)}
.row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.btn{border:1px solid var(--hair);background:rgba(255,255,255,.6);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:500;min-height:34px}
.btn.primary{background:var(--carbon);color:#F4EFE7;border-color:var(--carbon)}
.btn.esc{color:var(--crit);border-color:rgba(176,69,58,.35)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:rgba(255,255,255,.52);border:1px solid var(--hair-2);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.item .t{font-weight:600;font-size:13.5px;line-height:1.35}
.item .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.item .a{display:flex;flex-wrap:wrap;gap:6px}
.mono{font-family:var(--f-mono);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.funnel .row{margin:6px 0;flex-wrap:nowrap}
.funnel .lbl{width:112px;font-size:12px;flex:none}
.funnel .val{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}
.funnel .drop{width:38px;font-size:11px;color:var(--muted);text-align:right;flex:none}
pre.cy{margin:0;background:var(--carbon);color:#E8E2D8;border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre}
pre.cy .kw{color:#8FD3FF}
pre.cy .cm{color:#9C9488}

.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:16px;padding:10px 13px;font-size:13.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--carbon);color:#F4EFE7;border-bottom-right-radius:6px}
.msg.mi{align-self:flex-start;background:rgba(255,255,255,.62);border:1px solid var(--hair-2);border-bottom-left-radius:6px;width:100%;max-width:100%}
.msg.mi h4{font-family:var(--f-disp);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.msg.mi ol,.msg.mi ul{margin:0;padding-left:20px}
.msg.mi li{margin:3px 0}
.ans-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.plog{border:1px dashed rgba(36,33,28,.2);border-radius:14px;padding:8px 12px;background:rgba(255,255,255,.3);font-size:12.5px}
details.plog summary{cursor:pointer;color:var(--muted);font-size:12px}
details.plog ol{list-style:none;margin:6px 0 0;padding:0}
details.plog li{padding:2px 0}
details.plog .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block}
.prompts{display:flex;flex-wrap:wrap;gap:6px}
.prompts button{border:1px solid var(--hair);background:rgba(255,255,255,.55);border-radius:999px;padding:7px 12px;font-size:12.5px;min-height:34px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{flex:1;min-width:0;border:1px solid var(--hair);background:rgba(255,255,255,.7);border-radius:12px;padding:9px 12px;font:inherit;font-size:16px;color:var(--ink)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;border-radius:14px;padding:12px 16px;font-size:13px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;z-index:60;border-radius:12px;padding:10px 14px;font-size:13px;transition:.3s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#acts{position:fixed;left:var(--gutter-l);bottom:calc(env(safe-area-inset-bottom,0px) + 60px);z-index:15;display:flex;gap:2px;padding:4px;border-radius:12px}
#acts button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:500;min-height:32px}
#acts button:hover,#acts button.on{background:var(--carbon);color:#F4EFE7}
#hint{position:fixed;left:var(--gutter-l);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:14;font-size:12px;color:var(--muted);border-radius:999px;padding:7px 14px;white-space:nowrap}

@media (max-width: 760px){
  .data-note,#hint{display:none}
  #acts{bottom:auto;top:calc(var(--top) + 54px)}
  .brand{padding:6px}
  .brand > div:last-child{display:none}
  .mod{display:none}
  .tag{padding:4px 7px}
  .tag .task{display:none}
  .bubble{display:none}
  #dock{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:16;padding:12px var(--gutter-r) calc(env(safe-area-inset-bottom,0px) + 14px) var(--gutter-l)}
  #dock button{border-radius:14px;padding:10px 12px;text-align:left;min-height:56px}
  #dock .n{display:block;font-weight:600;font-size:13px;line-height:1.25}
  #dock .s{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
  #dock .s.alert{color:var(--crit)}
  #panel{left:0;right:0;width:auto;top:auto;bottom:0;height:58%;border-radius:22px 22px 0 0;transform:translateY(30px)}
  #panel.open{transform:none}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:rgba(36,33,28,.22);margin:8px auto 0}
  .p-head{padding:10px 16px 12px}
  .p-body{padding:14px 16px 18px}
}
@media (prefers-reduced-motion: reduce){
  #panel,#toast{transition:none}
  .st-thinking .dot,.st-working .dot,.typing i{animation:none}
}
</style>

  a.reset(); a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity); a.clampWhenFinished = once;
  a.enabled = true; a.setEffectiveWeight(1);
  if (current) current.crossFadeTo(a, fade, false);
  a.play(); current = a;
}
function centreHead(wrapper, inner, bones){
  inner.position.set(0, 0, 0); wrapper.updateMatrixWorld(true);
  const p = new THREE.Vector3(); bones.head.getWorldPosition(p); wrapper.worldToLocal(p);
  inner.position.set(-p.x, -p.y + .05, -p.z);
}
function setMi1HeadOnly(on){
  mi1.headOnly = on;
  const b = mi1.bones; if (!b.pelvis) return;
  mi1Group.position.set(L.mi1X, on ? L.orbitC.y : .1, 0);
  if (!on){ b.pelvis.scale.setScalar(1); b.neck.scale.setScalar(1); mi1Inner.position.set(0, 0, 0); mi1Group.scale.setScalar(1); }
  else { applyHeadOnly(b); mi1Group.scale.setScalar(isNarrow() ? 1.2 : 1.45); centreHead(mi1Group, mi1Inner, b); }
}
const mi1Y = t => mi1.headOnly ? L.orbitC.y + (reduce ? 0 : Math.sin(t * 1.4) * .03) : .1;

const crewPool = [];
const activeCrewCount = () => crewPool.filter(c => c.active).length;
function crewSlot(i, t, out){
  const n = Math.max(1, activeCrewCount());
  const gap = isNarrow() ? .3 : .34;
  const x = L.mi1X + (i - (n - 1) / 2) * gap;
  return out.set(x, (isNarrow() ? .3 : .32) + (reduce ? 0 : Math.sin(t * 1.3 + i) * .03), isNarrow() ? .9 : 1.0);
}
function makeCrew(){
  const root = SkeletonUtils.clone(baseRoot);
  root.position.set(0, 0, 0); root.rotation.set(0, 0, 0);
  const inner = new THREE.Group(); inner.add(root);
  const g = new THREE.Group(); g.add(inner);
  const bones = findBones(root);
  const mx = new THREE.AnimationMixer(root);
  const pick = n => clips.find(c => c.name === n);
  const acts = { Idle: mx.clipAction(pick('Idle')), Thinking: mx.clipAction(pick('Thinking')) };
  acts.Idle.play(); mx.update(0); applyHeadOnly(bones);
  centreHead(g, inner, bones);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(.2, .006, 8, 64), M.led); halo.rotation.x = Math.PI/2; halo.position.y = -.24; g.add(halo);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(.3, 12, 8), M.hit); g.add(hit);
  const tag = document.createElement('button'); tag.type = 'button'; tag.className = 'tag glass'; tag.hidden = true;
  labelsEl.appendChild(tag);
  const c = { g, root, inner, bones, mx, acts, tag, cur:acts.Idle, active:false, scale:0, idx:0, code:'', task:'', status:'queued' };
  hit.userData.crew = c;
  tag.addEventListener('click', () => focusCrew(c));
  g.visible = false; scene.add(g);
  return c;
}
function crewSet(c, status){
  c.status = status;
  c.tag.className = `tag glass st-${status}`;
  c.tag.innerHTML = `<span class="code"><span class="dot"></span>${esc(c.code)}</span><span class="task">${esc(c.task)}</span>`;
  c.tag.setAttribute('aria-label', `${c.code}: ${c.task}, ${LBL[status]}`);
  const want = (status === 'thinking' || status === 'working') ? c.acts.Thinking : c.acts.Idle;
  if (want !== c.cur){ want.reset().play(); c.cur.crossFadeTo(want, .3, false); c.cur = want; }
}
function spawnCrew(list){
  if (!baseRoot) return [];
  while (crewPool.length < list.length) crewPool.push(makeCrew());
  return list.map(([code, task], i) => {
    const c = crewPool[i]; Object.assign(c, { code, task, idx:i, active:true }); c.tag.hidden = false;
    crewSet(c, 'queued'); return c;
  });
}
function dismissCrew(){ crewPool.forEach(c => { c.active = false; }); if (mi1.look && mi1.look.crew) mi1.look = null; }

/* model: the glTF binary ships as base64 text because the host does not serve .glb */
if (renderer){
  const loader = new GLTFLoader();
  const onModel = gltf => {
    baseRoot = gltf.scene; clips = gltf.animations;
    baseRoot.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(baseRoot, true);
    baseRoot.scale.setScalar(1.75 / ((box.max.y - box.min.y) || 1));
    baseRoot.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(baseRoot, true);
    baseRoot.position.y -= box2.min.y;
    baseRoot.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
    mi1.bones = findBones(baseRoot);
    mixer = new THREE.AnimationMixer(baseRoot);
    clips.forEach(c => actions[c.name] = mixer.clipAction(c));
    play('Idle');
    mi1Inner.add(baseRoot);
    $('#loading').hidden = true;
    applyRole(state.role, true);
  };
  (async () => {
    try {
      const res = await fetch('mi1-model.txt');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const total = Number(res.headers.get('content-length')) || 13562648;
      const reader = res.body.getReader(); const parts = []; let got = 0;
      for (;;){ const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; $('#lp').textContent = Math.min(99, Math.round(got / total * 100)) + '%'; }
      const b64 = new TextDecoder().decode(await new Blob(parts).arrayBuffer());
      const bin = atob(b64.trim()); const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      loader.parse(buf.buffer, '', onModel, err => { console.error(err); fallback(); });
    } catch (err) { console.error(err); fallback(); }
  })();
}

/* ---------- look-at: the head turns toward the target, the body follows a little ---------- */
const qA = new THREE.Quaternion(), qB = new THREE.Quaternion(), qP = new THREE.Quaternion(), qI = new THREE.Quaternion();
const rightAx = new THREE.Vector3(), tp = new THREE.Vector3(), hp = new THREE.Vector3();
function lookTarget(out){
  const l = mi1.look; if (!l) return null;
  if (l.sat) return l.sat.g.getWorldPosition(out);
  if (l.crew) return l.crew.g.getWorldPosition(out);
  if (l.screen) return null;
  if (l.panel) return isNarrow() ? out.set(L.mi1X + .4, -.6, 3.5) : out.set(6, 1.3, 2.5);
  return null;
}
function updateLook(dt){
  let wantYaw = 0, wantPitch = 0;
  const head = mi1.bones.head;
  if (head && lookTarget(tp)){
    head.getWorldPosition(hp);
    wantYaw = THREE.MathUtils.clamp(wrapA(Math.atan2(tp.x - mi1Group.position.x, tp.z - mi1Group.position.z) - spin), -1.45, 1.45);
    wantPitch = THREE.MathUtils.clamp(Math.atan2(tp.y - hp.y, Math.hypot(tp.x - hp.x, tp.z - hp.z)), -.45, .5);
  }
  const k = Math.min(1, dt * 5);
  mi1.yaw += (THREE.MathUtils.clamp(wantYaw * .55, -1.1, 1.1) - mi1.yaw) * Math.min(1, dt * 3);
  mi1.headYaw += (THREE.MathUtils.clamp(wantYaw - mi1.yaw, -.8, .8) - mi1.headYaw) * k;
  mi1.headPitch += (wantPitch - mi1.headPitch) * k;
  mi1Group.rotation.y = spin + mi1.yaw;
  if (!head) return;
  mi1.headRest = head.quaternion.clone();
  if (Math.abs(mi1.headYaw) < 1e-4 && Math.abs(mi1.headPitch) < 1e-4) return;
  mi1Group.updateMatrixWorld(true);
  head.parent.getWorldQuaternion(qP);
  rightAx.set(1, 0, 0).applyAxisAngle(AX.y, spin + mi1.yaw + mi1.headYaw);
  qA.setFromAxisAngle(AX.y, mi1.headYaw);
  qB.setFromAxisAngle(rightAx, -mi1.headPitch).multiply(qA);
  qI.copy(qP).invert();
  head.quaternion.premultiply(qP).premultiply(qB).premultiply(qI);
}

const bubble = document.createElement('div'); bubble.className = 'bubble glass'; labelsEl.appendChild(bubble);
const v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
function toScreen(vec){ v3.copy(vec).project(camera); return { x:(v3.x * .5 + .5) * innerWidth, y:(-v3.y * .5 + .5) * innerHeight, z:v3.z }; }
function setBubble(text){ bubble.innerHTML = `<b>${esc(ROLES[state.role].agent)}</b>${esc(text)}`; $('#sr-proc').textContent = text; }
const panelOpen = () => $('#panel').classList.contains('open');

/* ================= loop ================= */
const clock = new THREE.Clock();
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let lastDraw = 0;
function tick(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (mi1.bones.head && mi1.headRest) mi1.bones.head.quaternion.copy(mi1.headRest);
  if (mixer) mixer.update(dt);
  if (mi1.headOnly) applyHeadOnly(mi1.bones);
  if (!reduce){ spin += spinV; spinV *= .92; }
  base.rotation.y = spin;
  mi1Group.position.set(L.mi1X, mi1Y(t), 0);
  updateLook(dt);

  const px = reduce || isNarrow() ? 0 : mouse.x * .2, py = reduce || isNarrow() ? 0 : mouse.y * .1;
  camera.position.set(px, cam.ty + cam.lift + py, cam.dist);
  camera.lookAt(0, cam.ty, 0);

  const goal = (hoverSat || reduce) ? 0 : 1;
  orbitSpeed += (goal - orbitSpeed) * Math.min(1, dt * 4);
  sats.forEach(s => {
    s.theta += s.speed * dt * orbitSpeed;
    orbitPoint(s, s.theta, s.g.position);
    s.tile.rotation.y = t * .4 + s.phase; s.tile.rotation.x = .3;
    s.line.material = (mi1.look && mi1.look.sat === s) || hoverSat === s.id ? M.orbitHi : M.orbit;
  });
  crewPool.forEach(c => {
    c.scale += ((c.active ? 1 : 0) - c.scale) * Math.min(1, dt * 5);
    c.g.visible = c.scale > .02;
    if (!c.g.visible){ c.tag.hidden = true; return; }
    c.mx.update(dt); applyHeadOnly(c.bones);
    crewSlot(c.idx, t, c.g.position);
    c.g.scale.setScalar((isNarrow() ? .28 : .32) * c.scale);
    c.g.lookAt(camera.position.x, c.g.position.y, camera.position.z);
  });
  if (proc.run && !proc.run.t1 && t - lastDraw > .25){ lastDraw = t; drawProc(); }

  if (renderer) renderer.render(scene, camera);
  positionLabels();
  requestAnimationFrame(tick);
}
function positionLabels(){
  const narrow = isNarrow();
  const leftMax = innerWidth * .34;
  const placed = [];
  [...sats].sort((a, b) => b.g.position.z - a.g.position.z).forEach(s => {
    s.g.getWorldPosition(tmp);
    const behind = tmp.z < -.2;
    tmp.y -= .13;
    const p = toScreen(tmp);
    const w = s.label.offsetWidth || 140, h = s.label.offsetHeight || 40;
    const x = Math.min(leftMax - w / 2, Math.max(w / 2 + 10, p.x));
    let y = Math.min(innerHeight - h - 56, Math.max(74, p.y));
    const overlaps = yy => placed.find(r => Math.abs(r.x - x) < (r.w + w) / 2 + 4 && yy < r.y + r.h + 4 && yy + h + 4 > r.y);
    let clash = false;
    const o = overlaps(y);
    if (o){ const yDown = o.y + o.h + 6, yUp = o.y - h - 6; if (!overlaps(yDown) && yDown + h < innerHeight - 10) y = yDown; else if (!overlaps(yUp) && yUp > 74) y = yUp; else clash = true; }
    const show = hoverSat === s.id || s.label.hasAttribute('aria-current');
    if (show) placed.push({ x, y, w, h });
    s.label.style.opacity = !show ? '0' : clash ? '.25' : behind ? '.72' : '1';
    s.label.style.pointerEvents = show && !clash ? 'auto' : 'none';
    s.label.style.zIndex = String(Math.round(200 + tmp.z * 20));
    s.label.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, 0) scale(${behind ? .92 : 1})`;
  });
  crewPool.forEach(c => {
    if (!c.g.visible) return;
    c.g.getWorldPosition(tmp); tmp.y -= narrow ? .14 : .2;
    const p = toScreen(tmp);
    const w = c.tag.offsetWidth || 120;
    const x = Math.min((narrow ? innerWidth * .36 : leftMax) - w / 2, Math.max(w / 2 + 8, p.x));
    c.tag.hidden = true;
    c.tag.style.opacity = String(Math.min(1, c.scale * 1.3));
    c.tag.style.zIndex = '260';
    const yy = Math.min(innerHeight - 70 - (c.idx % 2) * 46, p.y + (c.idx % 2) * 46);
    c.tag.style.transform = `translate3d(${x}px, ${yy}px, 0) translate(-50%, 0)`;
  });
  const head = mi1.bones.head;
  if (head && !narrow && !(proc.run && !proc.run.t1)){
    head.getWorldPosition(tmp); tmp.y += mi1.headOnly ? .55 : .42;
    const p = toScreen(tmp);
    const w = bubble.offsetWidth || 200;
    const x = Math.min(leftMax - w / 2, Math.max(w / 2 + 10, p.x));
    bubble.style.display = '';
    bubble.style.transform = `translate3d(${x}px, ${Math.max(140, p.y)}px, 0) translate(-50%, -100%)`;
  } else bubble.style.display = 'none';
}
let rsT = 0;
addEventListener('resize', () => { layout(); clearTimeout(rsT); rsT = setTimeout(() => { if (baseRoot){ setMi1HeadOnly(ROLES[state.role].head); buildSats(); } }, 200); });
layout();
addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5; });
function pick(e, objs){
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(objs, true)[0];
}
if (renderer){
  const cv = renderer.domElement;
  /* drag anywhere on the stage to turn Mi1 and its pedestal, 360 degrees */
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x:e.clientX, moved:0 }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointerup', () => { cv.style.cursor = ''; setTimeout(() => { drag = null; }, 0); });
  cv.addEventListener('pointermove', e => {
    if (!drag || (e.pointerType === 'mouse' && !(e.buttons & 1))) return;
    const dx = e.clientX - drag.x; drag.x = e.clientX; drag.moved += Math.abs(dx);
    if (drag.moved > 4){ spin += dx * .012; spinV = dx * .004; cv.style.cursor = 'grabbing'; }
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const hit = pick(e, sats.map(s => s.g));
    const id = hit ? hit.object.userData.satId || null : null;
    if (id) hoverSat = id; else if (hoverSat && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.mod)) hoverSat = null;
    cv.style.cursor = id ? 'pointer' : '';
  });
  cv.addEventListener('click', e => {
    if (drag && drag.moved > 4) return;
    const hit = pick(e, [...sats.map(s => s.g), ...crewPool.filter(c => c.g.visible).map(c => c.g)]);
    if (!hit) return;
    if (hit.object.userData.crew) return focusCrew(hit.object.userData.crew);
    if (hit.object.userData.satId) openModule(hit.object.userData.satId);
  });
}

/* ================= process runs (shown on the wall screen) ================= */
function newRun({ title, steps, crews }){
  const r = { id:'p' + Date.now(), title, steps:steps.map(s => ({ ...s, st:'pending' })), crews:(crews || []).map(([code, task]) => ({ code, task, st:'queued', tok:0 })), t0:performance.now(), t1:0, sel:null };
  proc.run = r; mi1.look = { screen:true }; renderProc(); return r;
}
function logHTML(r){
  return `<summary>Tiến trình · ${r.steps.length} bước${r.crews.length ? ' · ' + r.crews.length + ' thuyền viên' : ''} · ${elapsed(r)}</summary><ol>${r.steps.map(s => `<li>${s.st === 'done' ? '✓' : '·'} ${esc(s.t)}${s.d ? `<span class="d">${esc(stepD(s, r))}</span>` : ''}</li>`).join('')}${r.crews.map(c => `<li class="mono">${c.code} · ${esc(c.task)} · ${LBL[c.st]}${c.tok ? ' · ' + c.tok + 'k token' : ''}</li>`).join('')}</ol>`;
}
function renderProc(){
  drawProc();
  const r = proc.run; if (!r) return;
  const log = document.getElementById('log-' + r.id); if (log) log.innerHTML = logHTML(r);
}
function finishRun(r){
  r.t1 = performance.now(); renderProc(); proc.last = r;
  setTimeout(() => { if (proc.run === r){ proc.run = null; drawProc(); if (mi1.look && mi1.look.screen) mi1.look = openId ? { panel:true } : null; } }, reduce ? 800 : 5000);
}
async function stepRun(r, i, ms){
  const s = r.steps[i];
  s.st = 'running'; renderProc();
  const d = stepD(s, r);
  setBubble(s.t + (d && !s.fleet ? ' · ' + d : ''));
  await sleep(ms);
  s.st = 'done'; renderProc();
}
function focusCrew(c){
  mi1.look = { crew:c };
  if (proc.run){ proc.run.sel = c.idx; renderProc(); }
  setBubble(`${c.code}: ${c.task} · ${LBL[c.status]}`);
}

/* ================= panel + modules ================= */
const panel = $('#panel'), pBody = $('#p-body'), pFoot = $('#p-foot');
let openId = null, openSeq = 0;
function lookAtSat(id){
  const s = sats.find(x => x.id === id);
  if (s) mi1.look = { sat:s };
  sats.forEach(x => { if (x.id === id) x.label.setAttribute('aria-current', 'true'); else x.label.removeAttribute('aria-current'); });
}
async function openModule(id){
  if (!ROLES[state.role].mods.includes(id)) return;
  const seq = ++openSeq;
  lookAtSat(id);
  await sleep(450);
  if (seq !== openSeq) return;
  if (!state.busy && MOD_TOOLS[id].length){
    const r = newRun({ title:`Mở ${modName(id)}`, steps:[
      { t:'Nhận yêu cầu', d:`mở ${modName(id)}` },
      ...MOD_TOOLS[id].map(([tool, d]) => ({ t:`Gọi ${tool}`, d })),
      { t:'Hiển thị', d:'panel frosted glass' }
    ]});
    for (let i = 0; i < r.steps.length; i++){ await stepRun(r, i, i === 0 ? 200 : 320); if (seq !== openSeq) return; }
    finishRun(r);
  } else { setBubble(`Mở ${modName(id)}.`); await sleep(200); if (seq !== openSeq) return; }
  openId = id;
  renderPanel(id);
  panel.hidden = false; panel.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => panel.classList.add('open'));
  if (!state.busy){ mi1.look = { panel:true }; setBubble(`${modName(id)} đã mở.`); }
  const first = pBody.querySelector('input, button'); if (first && !isNarrow()) first.focus({ preventScroll:true });
}
function closePanel(){
  openSeq++;
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if (!panel.classList.contains('open')) panel.hidden = true; }, 350);
  openId = null;
  if (!state.busy){ mi1.look = null; setBubble(ROLES[state.role].greet); }
  sats.forEach(s => s.label.removeAttribute('aria-current'));
}

let toastT = 0;

function escalate(what, btn){

function decide(id, how){

    { t:'Đọc câu hỏi', d:`"${q}"` },
    { t:'Phân loại ý định', d: sc ? `${sc.intent} · tin cậy ${sc.ic}` : 'chưa có kịch bản mẫu, định tuyến theo từ khóa' },
    ...tools.map(([tool, d]) => ({ t:`Gọi ${tool}`, d })),
    { t:`Gọi fleet · ${crews.length} thuyền viên`, d: crews.map(c => c[0]).join(', ') },
    { t:'Chờ thuyền viên', fleet:true, d: rr => `${rr.crews.filter(c => c.st === 'done').length}/${rr.crews.length} xong` },
    { t:'Gộp kết quả, tính tự tin', d: sc ? `tự tin ${sc.conf}${confNum(sc.conf) < .8 ? ' · dưới 0,8, gắn nút escalate' : ''}` : 'không áp dụng' },
    { t:'Soạn trả lời', d:'việc cần làm · quyết định · dự báo · cảnh báo' }
  ]});
  const logIdx = pushChat(`<details class="plog" id="log-${r.id}"></details>`);
  renderProc();
  play('Thinking');
  const fleetAt = 2 + tools.length;
  for (let i = 0; i < fleetAt; i++) await stepRun(r, i, i < 2 ? 500 : 620);
  r.steps[fleetAt].st = 'running'; renderProc(); setBubble(`Gọi ${crews.length} thuyền viên lên.`);
  const list = spawnCrew(crews);
  await sleep(650);
  r.steps[fleetAt].st = 'done'; r.steps[fleetAt + 1].st = 'running'; renderProc();
  await Promise.all(crews.map(async (cw, i) => {
    await sleep(150 + i * 260);
    r.crews[i].st = 'thinking'; if (list[i]) crewSet(list[i], 'thinking'); renderProc();
    await sleep(850);
    r.crews[i].st = 'working'; if (list[i]) crewSet(list[i], 'working'); renderProc();
    setBubble(`${cw[0]} đang ${cw[1].charAt(0).toLowerCase() + cw[1].slice(1)}.`);
    await sleep(1100 + i * 450);
    r.crews[i].st = 'done'; r.crews[i].tok = 14 + i * 9 + q.length % 7; if (list[i]) crewSet(list[i], 'done'); renderProc();
  }));
  r.steps[fleetAt + 1].st = 'done'; renderProc();
  for (let i = fleetAt + 2; i < r.steps.length; i++) await stepRun(r, i, 520);
  finishRun(r);
  const body = sc ? sc.html(state.role) : `
    <div class="ans-head"><span class="chip">Chưa có kịch bản mẫu</span></div>
    <p style="margin:6px 0 0">Prototype chưa có câu trả lời mẫu cho câu này. Khi chạy thật, ${esc(ROLES[state.role].agent)} phân loại ý định, gọi ${crews.map(c => c[0]).join(', ')}, rồi trả về theo cùng khung: việc cần làm, quyết định cần anh, dự báo, cảnh báo.</p>`;
  const foot = sc ? `<p class="src" style="margin:10px 0 0">Nguồn: ${esc(sc.src)}. Dữ liệu mẫu.</p>` : '';
  const log = document.getElementById('log-' + r.id);
  if (log) state.chats[state.role][logIdx] = log.outerHTML;
  pushChat(`<div class="msg mi">${body}${foot}</div>`);
  state.busy = false;
  play('Excited', { once:true, fade:.2 });
  setTimeout(() => { if (!state.busy) play('Idle', { fade:.4 }); }, 1100);
  setBubble(sc && confNum(sc.conf) < .8 ? 'Xong. Tự tin dưới 0,8 nên có nút escalate.' : 'Xong. Kết quả ở bảng hội thoại.');
  setTimeout(() => { if (!state.busy) dismissCrew(); }, reduce ? 300 : 4500);
}

/* ================= motion sets with studio-style sound (Web Audio, starts on click) ================= */
let actx = null, actRun = 0, soundOn = true;
try { soundOn = localStorage.getItem('mi1-sound') !== 'off'; } catch (_) {}
const sndBtn = $('#snd');
function paintSnd(){ sndBtn.setAttribute('aria-pressed', String(soundOn)); sndBtn.textContent = soundOn ? 'Âm thanh: Bật' : 'Âm thanh: Tắt'; }
paintSnd();
sndBtn.addEventListener('click', () => { soundOn = !soundOn; paintSnd(); try { localStorage.setItem('mi1-sound', soundOn ? 'on' : 'off'); } catch (_) {} if (!soundOn && actx) actx.suspend(); });
function tone(seq){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + .02;
    const out = actx.createGain(); out.gain.value = .9; out.connect(actx.destination);
    seq.forEach(([f, at, dur, type = 'sine', vol = .12]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + .015); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
      o.connect(g).connect(out); o.start(t0 + at); o.stop(t0 + at + dur + .05);
    });
  } catch (_) {}
}
const SFX = {
  join: [[523, 0, .2], [659, .11, .2], [784, .22, .35], [1047, .22, .35, 'sine', .04]],
  work: [0, 1.5, 3, 4.5, 6].flatMap(o => [[392, o, .09, 'triangle', .05], [440, o + .18, .09, 'triangle', .05], [494, o + .36, .12, 'triangle', .05]]),
  done: [[784, 0, .16], [988, .12, .16], [1175, .24, .5], [1568, .24, .5, 'sine', .05], [587, .24, .6, 'triangle', .05]]
};
const MOVES = { join:[['Jump', 'Mi1 vào ca.'], ['Excited', 'Sẵn sàng làm việc.']], work:[['Scenario_Study', 'Đang làm việc.']], done:[['Scenario_Celebrate', 'Xong việc.']] };
function perform(kind, btn){
  if (!mixer) return;
  const id = ++actRun;
  document.querySelectorAll('[data-act]').forEach(b => b.classList.toggle('on', b === btn));
  tone(SFX[kind]);
  const steps = MOVES[kind];
  let at = 0;
  steps.forEach(([clip, msg]) => {
    const c = clips.find(x => x.name === clip); if (!c) return;
    setTimeout(() => { if (id !== actRun) return; if (actions[clip] === current) current.reset().play(); else play(clip, { once:true, fade:.25 }); setBubble(msg); }, at * 1000);
    at += c.duration;
  });
  setTimeout(() => { if (id !== actRun) return; play('Idle', { fade:.4 }); if (btn) btn.classList.remove('on'); }, at * 1000);
}

/* ================= roles ================= */
function applyRole(role, initial){
  if (state.busy && !initial){ toast('Đang xử lý, đợi lượt này xong.'); return; }
  state.role = role;
  document.querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === role)));
  dismissCrew(); mi1.look = null;
  if (openId){ panel.classList.remove('open'); panel.hidden = true; openId = null; }
  proc.run = null; proc.last = null;
  layout();
  if (baseRoot){ setMi1HeadOnly(ROLES[role].head); buildSats(); }
  if (mixer) play(initial ? 'Idle' : 'Excited', { once:!initial });
  if (!initial) setTimeout(() => play('Idle'), 1000);
  setBubble(ROLES[role].greet);
}
refreshLabels();
setBubble(ROLES.mark.greet);
</script>
