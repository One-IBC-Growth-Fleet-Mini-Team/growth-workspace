# Bộ chạy Growth Workspace trên một máy Linux (D-03): container ứng dụng + Caddy (HTTPS tự động).
# Lịch job do systemd của máy chủ giữ (deploy/systemd), không có thư viện cron trong tiến trình.
# Đường dẫn trên máy chủ đổi được bằng biến GROWTH_ENV_DIR, GROWTH_DATA_DIR (mặc định /etc/growth, /srv/growth).
name: growth

services:
  growth:
    build:
      context: ..
      dockerfile: Dockerfile
    image: growth-workspace:local
    restart: unless-stopped
    env_file: ${GROWTH_ENV_DIR:-/etc/growth}/growth.env
    environment:
      GROWTH_DB_PATH: /data/growth.sqlite
      SA01_EVAL_RESULTS_DIR: /data/eval-results
      GROWTH_BACKUP_DIR: /data/backups
    volumes:
      - ${GROWTH_DATA_DIR:-/srv/growth}/data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: ${GROWTH_ENV_DIR:-/etc/growth}/caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${GROWTH_DATA_DIR:-/srv/growth}/caddy:/data
    depends_on:
      growth:
        condition: service_healthy
